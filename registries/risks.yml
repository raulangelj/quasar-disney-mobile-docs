  - id: RISK-0013
    status: open
    title: "Deployment and recovery posture is a manual procedure, a spare binary, and a git push"
    category: operations
    severity: low
    owner: "TBD"
    opened: "2026-08-17"
    source: "architecture/08-infrastructure-deployment.md"
    description: "Session 1.8 deliberately scoped to a showcase with no QA or deployment tier: no native CI, no IaC beyond committed lockfiles, no secret manager, no availability target. A JavaScript GitHub Actions gate exists from 1.12 (ADR-0018) but does not produce binaries. Session 1.9 confirmed environments are two build configurations rather than deployment tiers, and no staging or sandbox tier exists. Recovery is reinstalling the previous known-good .ipa/.apk (RTO ~1 min, RPO = last git push)."
    impact: "Correct for an internal POC and negligent for a product with users. The gap surfaces the moment anyone other than the two devs depends on a build, or real data exists."
    mitigation: "The manual procedure is written down and repeatable (runbooks/release-deploy.md); build on two machines and install on two devices; keep the previous binary. Session 1.9 hardened the procedure: trunk-only builds, clean-state install verified at the welcome screen, .env key-completeness check, and a release-build smoke at every sync point."
    revisit_trigger: "Bitrise implementation (Phase 2), Phase 3 backend integration (when a staging tier becomes meaningful — OQ-31), or any real users / real data / store submission — whichever comes first."
    refs:
      - "architecture/08-infrastructure-deployment.md#3-deploy-pipeline--build--install--roll-back"
      - "architecture/08-infrastructure-deployment.md#7-backups--dr--artifact-and-code-survival"
      - "architecture/09-environments.md#7-promotion-flow"
      - "runbooks/release-deploy.md"
    closed:
      date:
      reason:

  - id: RISK-0014
    status: open
    title: "The app ships no telemetry — no metrics, tracing, crash reporting, or release-build logs"
    category: operations
    severity: low
    owner: "TBD"
    opened: "2026-08-17"
    source: "architecture/10-observability.md"
    description: "Session 1.10 consciously declined metrics, distributed tracing, health checks, correlation IDs, dashboards, alerting, and any error-tracking vendor, and left the release configuration's console.* strip in place. Logging is bare console.* in development only, and request/response bodies are never logged at all."
    impact: "If the sign-off binary misbehaves in a way that is not visible on screen there is no signal at all, and diagnosis means reproducing it on a development build. Correct for an internal POC held by its own authors; negligent for a product with users."
    mitigation: "One shell-root React error boundary ships in both configurations so a render exception degrades to a recoverable screen rather than a white one. Release build is smoked at every sync point (doc 09 §6.1) and the previous known-good binary reinstalls in ~1 minute (doc 08 §7)."
    revisit_trigger: "The first time anyone outside the two developers depends on a running build, any real user data, Phase 3 backend integration (correlation IDs, health checks), or a store submission — whichever comes first."
    refs:
      - "architecture/10-observability.md#9-what-this-accepts"
      - "architecture/10-observability.md#2-logging"
      - "architecture/10-observability.md#5-error-tracking--one-boundary-no-vendor"
      - "architecture/09-environments.md#6-parity--the-release-only-failure-class"
    closed:
      date:
      reason:

  - id: RISK-0015
    status: open
    title: "No automated end-to-end or device-level test; system verification is a manual smoke"
    category: tech-debt
    severity: medium
    owner: "TBD"
    opened: "2026-08-17"
    source: "architecture/12-test-strategy.md"
    description: "Session 1.12 declined tier T4 (Detox/Maestro) for Phase 1: it needs a stable build and a runner, and no CI can build native artifacts until Bitrise (OQ-05). The only whole-system verification is the manual release smoke in runbooks/release-deploy.md Part 3."
    impact: "Nothing automatically proves that welcome -> credentials -> home works end to end on a device. A regression in the assembled app that unit and integration tests both miss is caught only if a human runs the smoke sequence."
    mitigation: "The smoke sequence is written down, traces criteria F1/F2/F3 + A1 + a11y, and doc 09 §6.1 requires it at every sync point rather than once. The T2 integration tier exercises store + middleware + adapter together, so the assembled data path is covered below the UI."
    revisit_trigger: "Bitrise landing in Phase 2 (OQ-05) — a runner plus installable builds is what makes an e2e tier affordable."
    refs:
      - "architecture/12-test-strategy.md#2-test-tiers"
      - "architecture/12-test-strategy.md#6-system--end-to-end-testing"
      - "runbooks/release-deploy.md"
    closed:
      date:
      reason:

  - id: RISK-0016
    status: open
    title: "Coverage is reported but not gated in Phase 1a"
    category: tech-debt
    severity: low
    owner: "TBD"
    opened: "2026-08-17"
    source: "architecture/12-test-strategy.md"
    description: "Jest coverage runs on every CI job and its summary is visible on every PR, but there is no numeric threshold, no changed-lines gate, and no coverage service. Per-path thresholds (src/api/**, src/features/*/state/** at ~80%) are deferred to Phase 1b."
    impact: "Coverage can regress without failing a build. Bounded because doc 12 §3's named must-cover list is enforced by review and by the specific tests it requires, which a percentage would not guarantee."
    mitigation: "A global threshold was rejected on purpose: UI tests are deferred by decision (RISK-0001), so any aggregate number is either meaningless or punishes a deliberate architectural choice. Coverage is treated as a trend signal; the must-cover list is the real gate."
    revisit_trigger: "Phase 1b, once UI/component tests exist and make an aggregate figure honest — introduce per-path thresholds then."
    refs:
      - "architecture/12-test-strategy.md#81-no-numeric-threshold-in-phase-1a"
      - "architecture/12-test-strategy.md#3-coverage-priorities"
    closed:
      date:
      reason:

  - id: RISK-0017
    status: open
    title: "Criterion A2 is enforced by a pattern-matching lint rule that cannot catch computed values"
    category: tech-debt
    severity: low
    owner: "TBD"
    opened: "2026-08-17"
    source: "architecture/12-test-strategy.md"
    description: "Launch criterion A2 (zero hardcoded colors, typography, or spacing outside the theme) is gated by an ESLint no-restricted-syntax rule matching hex/rgb() literals and raw px values outside src/shared/theme/. It catches literals; it cannot catch a color or dimension computed at runtime."
    impact: "A hardcoded design value can reach the demo through a computed expression while CI shows green, weakening the theme-swap argument (criterion A1) that the POC exists to demonstrate."
    mitigation: "The 90% rule ships rather than relying on review alone, and doc 12 §7.1 states its reach explicitly instead of implying A2 is fully automated. The theme token-parity test (doc 12 §3.4) and the A1 smoke step (runbooks/release-deploy.md Part 3) catch the visible consequences."
    revisit_trigger: "Phase 1b UI tests — a rendered-output assertion can catch what static analysis cannot; or the first time a hardcoded value is found in review despite a green gate."
    refs:
      - "architecture/12-test-strategy.md#71-what-blocks-merge"
      - "architecture/02-phasing-roadmap.md#4-launch-criteria"
      - "adr/ADR-0018-two-tier-ci-js-gate-before-bitrise.md"
    closed:
      date:
      reason:

