  - id: RISK-0011
    status: open
    title: "Accessibility is verified only by a manual pass in Phase 1a"
    category: tech-debt
    severity: medium
    owner: "TBD"
    opened: "2026-08-17"
    source: "architecture/07-ui-design-system.md"
    description: "The design system targets WCAG 2.1 AA and specifies labels, grouping, live-region errors, and reduced-motion mapping, but UI tests are deferred to 1b (RISK-0001), so nothing asserts any of it."
    impact: "A missing accessibilityLabel or an ungrouped tile ships silently. The live-region auth error is the sharpest case: without it a failed login is inaudible to a screen-reader user, so criterion F2 fails for them while appearing to pass."
    mitigation: "A11y props are written as each atom is written, not retrofitted; a 10-minute VoiceOver + TalkBack pass is added to the Tuesday-AM smoke checklist (doc 02 §8)."
    revisit_trigger: "Phase 1b UI tests — add a11y assertions to the component test suite."
    refs:
      - "architecture/07-ui-design-system.md#8-accessibility"
      - "architecture/02-phasing-roadmap.md#2-phase-1a-the-2026-08-18-demo-cut"
    closed:
