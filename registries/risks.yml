  - id: RISK-0003
    status: open
    title: "Bare React Native scaffold on two platforms is the critical-path schedule risk"
    category: reliability
    severity: high
    owner: "TBD"
    opened: "2026-08-14"
    source: "architecture/02-phasing-roadmap.md"
    description: "Pods, signing, emulators, and Xcode version drift can consume half a day of a ~3.5-day window with no warning. Session 1.8 chose lockfiles-only reproducibility (no authored pin files, no toolchain table), so Xcode version drift between the two laptops stays explicitly unmitigated inside this risk."
    impact: "If the scaffold slips, the Sunday auth-flow plan no longer closes before the immovable 2026-08-18 sign-off."
    mitigation: "Pre-agreed fallback: if no app runs on both platforms by Saturday midday, drop Android for Saturday, pursue iOS only, bring Android up Monday. Commit every lockfile the RN scaffold generates."
    revisit_trigger: "Saturday 2026-08-15 midday checkpoint."
    refs:
      - "architecture/02-phasing-roadmap.md#8-schedule-and-schedule-risk"
      - "architecture/08-infrastructure-deployment.md#4-infrastructure-as-code--lockfiles-only"
    closed:
      date:
      reason:

