<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 140" width="340" height="140" role="img" aria-label="Dinsey-">
  <title>Dinsey- wordmark (light — for dark surfaces)</title>
  <g fill="#FFFFFF">
    <!-- Swoosh: the silhouette cue that reads as "streaming brand" at a glance. -->
    <path d="M14 64 C 64 6, 250 -12, 316 22 C 252 2, 72 22, 22 68 Z"/>
    <text x="18" y="118"
          font-family="Avenir Next, Futura, Trebuchet MS, Verdana, sans-serif"
          font-size="64" font-weight="700" letter-spacing="1.5">Dinsey</text>
    <!-- Trailing dash: the brand is "Dinsey-", the dash is part of the mark. -->
    <rect x="252" y="84" width="44" height="11" rx="5.5"/>
  </g>
</svg>
